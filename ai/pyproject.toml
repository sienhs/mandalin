[project]
name = "webrtc-sfu"
version = "1.0.0"
description = "Python (FastAPI + aiortc) SFU with a vanilla JavaScript WebRTC client"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiortc>=1.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # 런타임 의존입니다. `app/bot/llm.py` 가 LLM 게이트웨이를 호출할 때 씁니다 —
    # dev 로 두면 `pip install .` 로 설치한 서버가 첫 봇 응답에서 죽습니다.
    "httpx>=0.27",
    # 입장 티켓(JWT) 검증. [crypto] 는 RS256 용이며, cryptography 는 aiortc 가
    # 이미 끌어옵니다.
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "pytest-timeout>=2.3"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
