# ── coturn / STUN + TURN ────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349

# 컨테이너가 보는 사설 IP와 클라이언트가 접속할 공인 IP를 함께 지정합니다.
# 배포 시 반드시 실제 값으로 바꾸세요.
# listening-ip=0.0.0.0
# external-ip=<PUBLIC_IP>/<PRIVATE_IP>

realm=webrtc.local
server-name=webrtc.local

# long-term credential (개발용). 운영에서는 use-auth-secret + REST API 방식 권장.
lt-cred-mech
# 사용자/비밀번호는 여기 두지 않고 compose 의 `--user=${TURN_USERNAME}:${TURN_CREDENTIAL}`
# 로 넘깁니다. SFU 의 TURN_CREDENTIAL 과 같은 변수에서 나와야 하기 때문입니다 — 이 파일에
# 박아두면 한쪽만 바꿨을 때 TURN 인증만 조용히 실패합니다(NAT 뒤 사용자만 연결 실패).
# **`--user` 없이 이 파일만으로 띄우면 등록된 사용자가 없어 모든 TURN 인증이 거절됩니다.**

# 릴레이 포트 범위 — 방화벽/보안그룹에서 UDP로 함께 열어야 합니다.
min-port=49160
max-port=49200

fingerprint
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# 사설 대역으로의 릴레이 차단 (SSRF 방지)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255

# 운영 환경 예시 (REST API 방식)
# use-auth-secret
# static-auth-secret=<RANDOM_LONG_SECRET>
