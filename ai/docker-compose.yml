# SFU + coturn. 로컬 개발과 **AI 전용 EC2 배포에 같이 쓰는 파일입니다.**
#
# AI 서버는 메인 EC2(infra/docker-compose.yml 의 nginx·Spring·DB)와 분리된 EC2 에
# 이 파일로 띄웁니다. aiortc 가 피어마다 UDP 포트를 잡아 network_mode: host 가
# 필요한데, 이건 infra 의 app-net 브리지와 공존할 수 없어서입니다. 그래서
# infra/docker-compose.yml 에는 sfu 블록이 없고, 앞으로도 두지 않습니다.
#
# 분리의 대가는 **두 호스트에 나눠 둔 값이 어긋나도 양쪽 다 기동은 된다**는 것입니다.
# Spring 의 SFU_TICKET_SECRET ↔ 여기 AUTH_JWT_KEY 가 다르면 사용자만 입장에서
# 튕기고, 로그를 봐야 원인을 알 수 있습니다. 한쪽을 바꾸면 반드시 같이 바꾸세요.
#
# **`.env` 는 이 컨테이너에 들어가지 않습니다** (.dockerignore). 그래서 컨테이너의 설정은
# 아래 environment 블록이 전부이고, 여기 없는 값은 app/config.py 의 기본값이 됩니다.
# 그 기본값 중 셋은 배포에서 사고가 됩니다 — `AUTH_REQUIRED=false`(방 이름만 알면 입장),
# `BOT_ENABLED=false`(AI 없는 방에 혼자 입장), `BOT_MODE=chat`(과제 제안이 오지 않음).
# 그래서 명시적으로 켜 둡니다.
#
# 띄우기 전에 채워야 하는 값 (없으면 compose 가 기동을 거부합니다):
#
#   export SFU_TICKET_SECRET=<Spring 의 SFU_TICKET_SECRET 과 같은 값>
#   export BOT_API_KEY=<LLM 키>
#   export TURN_PUBLIC_IP=<서버 공인 IP>        # 로컬 테스트라면 127.0.0.1
#   docker compose up -d --build
#
# 값이 비면 조용히 반쪽으로 뜨는 것보다 기동을 멈추는 편이 낫습니다 — 인증이 꺼진 채로
# 뜬 서버는 로그를 봐야 알 수 있고, TURN 이 127.0.0.1 이면 NAT 뒤 사용자만 연결에
# 실패해서 원인을 찾기까지 오래 걸립니다.
services:
  sfu:
    build: .
    container_name: webrtc-sfu
    restart: unless-stopped
    # aiortc allocates one UDP port per peer connection; host networking is the
    # simplest way to expose them. On Docker Desktop (macOS/Windows) swap this
    # for an explicit port range and set a fixed ICE port range instead.
    network_mode: host
    environment:
      # --- HTTP -----------------------------------------------------------
      # network_mode: host 라 이 포트가 곧 호스트 포트입니다. 이 EC2 에 Spring 은 없지만
      # 8080 은 관례상 비워 두고 8081 을 씁니다. 브라우저는 이 포트에 직접 붙지 않습니다
      # — 프론트가 https(Vercel)라 ws:// 가 차단되므로 wss 로 받아 줄 리버스 프록시가
      # 필요합니다. **프록시는 메인 EC2 의 nginx 이고, 이 서버와 다른 호스트입니다.**
      # 즉 proxy_pass 대상은 127.0.0.1 이 아니라 이 EC2 의 사설 IP:8081 이고, 8081 은
      # 메인 EC2 에서만 들어오도록 보안그룹을 잠가야 합니다. (SSAFY 도메인이 프로젝트당
      # 하나라 AI EC2 에 인증서를 따로 붙이는 대신 메인 nginx 를 경유시킵니다. 시그널링만
      # 지나가고 미디어는 이 서버와 직접 흐르므로 경유 부하는 무시할 수준입니다.)
      PORT: ${SFU_PORT:-8081}
      # `/api/bot/*` 와 `/api/rooms/*` 는 인증이 없습니다. 켜두면 주소만 아는 누구나
      # LLM 크레딧을 태우고 시스템 프롬프트를 읽고 TURN 자격증명을 가져갑니다.
      DEBUG_API_ENABLED: "false"

      # --- 인증 -----------------------------------------------------------
      # 티켓 검증. Spring 이 `POST /api/voice-sessions` 로 서명해 준 티켓만 받습니다.
      AUTH_REQUIRED: "true"
      # HS256 은 검증 키 = 서명 키입니다. **Spring 의 SFU_TICKET_SECRET 과 같은 값**이어야
      # 하고, Spring 의 jwt.secret 을 재사용하면 안 됩니다(이 서버가 액세스 토큰까지
      # 위조할 수 있게 됩니다).
      AUTH_JWT_KEY: ${SFU_TICKET_SECRET:?Spring 의 SFU_TICKET_SECRET 과 같은 값을 넣으세요}
      # Spring 의 sfu.audience / sfu.issuer 와 일치해야 합니다. 비우면 다른 용도로 발급된
      # 토큰이 이 서버에 재사용될 수 있습니다.
      AUTH_JWT_AUDIENCE: ${SFU_AUDIENCE:-sfu}
      AUTH_JWT_ISSUER: ${SFU_ISSUER:-mandarin}

      # --- 방 정책 --------------------------------------------------------
      # 2 = 본인 + AI 봇. 봇도 정원 한 자리를 차지하므로 1 로 두면 본인이 ROOM_FULL 로 튕깁니다.
      MAX_PARTICIPANTS_PER_ROOM: "2"

      # --- ICE ------------------------------------------------------------
      STUN_URLS: '["stun:stun.l.google.com:19302"]'
      TURN_URLS: '["turn:${TURN_PUBLIC_IP:?서버 공인 IP 를 넣으세요 (로컬 테스트는 127.0.0.1)}:3478?transport=udp","turn:${TURN_PUBLIC_IP}:3478?transport=tcp"]'
      TURN_USERNAME: ${TURN_USERNAME:-webrtc}
      # coturn/turnserver.conf 의 `user=webrtc:...` 에 같은 비밀번호가 박혀 있습니다.
      # **둘을 같이 바꾸세요** — 한쪽만 바꾸면 TURN 인증이 실패합니다.
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-change-me-please}
      # 서버는 공인 주소를 가지므로 자기 트래픽에 TURN 이 필요 없습니다.
      SERVER_USES_TURN: "false"

      # --- AI 봇 ----------------------------------------------------------
      BOT_ENABLED: "true"
      BOT_DISPLAY_NAME: AI
      BOT_PROVIDER: gemini
      # 분류 -> 후보 검색 -> 판단. 이 값이 chat 이면 응답에 `goal` 이 실리지 않아
      # 프론트에 "담기" 버튼이 아예 붙지 않습니다.
      BOT_MODE: goal
      # 1단계 모델은 **멀티모달이어야 합니다** — 푸시투토크 오디오의 받아쓰기가 여기서
      # 일어납니다. 텍스트 전용 모델을 넣으면 음성 입력이 깨집니다.
      BOT_CLASSIFY_MODEL: ${BOT_CLASSIFY_MODEL:-gemini-2.5-flash}
      BOT_DECIDE_MODEL: ${BOT_DECIDE_MODEL:-gemini-2.5-flash-lite}
      BOT_DEFAULT_MODEL: ${BOT_DEFAULT_MODEL:-gemini-2.5-flash}
      # 사내 게이트웨이. 비우면 Google 엔드포인트로 직접 나가므로 발급받은 키가 통하지 않습니다.
      BOT_BASE_URL: ${BOT_BASE_URL:-https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com}
      BOT_API_KEY_IN_QUERY: "true"
      BOT_API_KEY: ${BOT_API_KEY:?LLM 키를 넣으세요 (없으면 AI 응답이 전부 실패합니다)}
      # 프롬프트·예시 과제는 Dockerfile 이 /srv/prompts 로 복사합니다. 경로가 어긋나면
      # 예외가 아니라 **경고 로그만 남기고 내장 기본 프롬프트로 조용히 돌아갑니다.**
      BOT_SYSTEM_PROMPT_FILE: ./prompts/system.md
      BOT_CLASSIFY_PROMPT_FILE: ./prompts/classify.md
      BOT_TEMPLATE_FILE: ./prompts/templates.json
      BOT_CANDIDATE_COUNT: "5"
      # 게이트웨이가 느려서 코드 기본값(15/20)으로는 타임아웃이 납니다.
      BOT_STEP_TIMEOUT_SECONDS: "25"
      BOT_TIMEOUT_SECONDS: "45"
      BOT_HISTORY_TURNS: "4"
      # 응답 캐시는 **개발용입니다.** 키가 발화 텍스트뿐이라 대화 맥락을 무시합니다 —
      # 앞에서 무슨 말을 했든 같은 답이 나오므로 운영에서는 0(꺼짐)으로 둡니다.
      BOT_CACHE_SIZE: "0"
      # 푸시투토크 음성. BOT_VOICE_DEBUG_DIR 은 켜지 않습니다 — 켜면 발화마다 WAV 가
      # 디스크에 쌓이고 지우는 사람이 없습니다.
      BOT_VOICE_ENABLED: "true"
      BOT_VOICE_MAX_SECONDS: "60"
    depends_on:
      - coturn

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: webrtc-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    # 자격증명은 conf 가 아니라 여기서 넘깁니다 — sfu 의 TURN_CREDENTIAL 과 같은 변수에서
    # 나와야 하기 때문입니다(coturn/turnserver.conf 주석 참고). --external-ip 이 없으면
    # NAT 뒤(EC2 등)에서 사설 IP 를 릴레이 후보로 광고해 아무도 붙지 못합니다.
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--external-ip=${TURN_PUBLIC_IP:?서버 공인 IP 를 넣으세요 (로컬 테스트는 127.0.0.1)}"
      - "--user=${TURN_USERNAME:-webrtc}:${TURN_CREDENTIAL:-change-me-please}"
