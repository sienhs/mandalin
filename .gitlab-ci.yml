stages:
  - deploy

default:
  image: node:22
  before_script:
    - npm install --global vercel

deploy_preview:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH != "master"'
      changes:
        - frontend/**/*
  script:
    - cd frontend
    - vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
    - vercel build --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --token=$VERCEL_TOKEN

deploy_production:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - frontend/**/*
  script:
    - cd frontend
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - vercel build --prod --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

# AI 음성 코치(LiveKit)를 AI 전용 EC2 로 배포합니다.
#
# **위 두 잡과 도는 곳이 다릅니다.** 프론트 잡은 메인 EC2 의 docker executor 러너에서
# 돌지만, 이 잡은 AI EC2 에 따로 등록한 shell executor 러너에서 돕니다 — `tags` 가
# 그것을 가릅니다. 그래서 SSH 키를 CI 변수에 넣을 필요도, 보안 그룹에 22번을 열 필요도
# 없습니다(러너가 GitLab 으로 아웃바운드만 합니다).
deploy_ai:
  stage: deploy
  tags:
    - ai-sfu

  # **비우지 않으면 이 잡이 반드시 실패합니다.** default.before_script 가
  # `npm install --global vercel` 인데 AI EC2 러너는 shell executor 라 node 가 없습니다.
  # (같은 이유로 default.image 의 node:22 도 이 잡에는 적용되지 않습니다 — shell
  # executor 는 image 를 무시하고 호스트에서 그대로 실행합니다.)
  before_script: []

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - ai_livekit/**/*

  # 배포 위치. **러너의 빌드 디렉터리에서 직접 compose 를 돌리지 않습니다.**
  #
  # 그 경로(`/home/gitlab-runner/builds/…`)는 사람이 찾아 들어갈 만한 곳이 아니고 잡마다
  # 덮어써집니다. 운영 중 로그를 보거나 worker 만 재시작하려면 들어갈 디렉터리가 하나로
  # 정해져 있어야 합니다. 그래서 체크아웃을 고정 경로로 동기화한 뒤 거기서 띄웁니다.
  #
  #   cd /opt/mandarin/ai_livekit
  #   docker compose logs -f worker
  #   docker compose restart worker
  variables:
    DEPLOY_DIR: /opt/mandarin/ai_livekit

  script:
    # `--delete` 로 저장소에서 지운 파일이 서버에 남지 않게 합니다.
    #
    # **`.env` 는 반드시 제외합니다.** 시크릿은 저장소에 없고 이 디렉터리에 상주하는데,
    # 빼지 않으면 배포할 때마다 지워집니다. 그러면 compose 가 `${LIVEKIT_API_KEY}` 를
    # 빈 문자열로 조용히 치환해서, 에러 없이 아무도 입장 못 하는 상태가 됩니다.
    - rsync -a --delete --exclude='.env' ai_livekit/ "$DEPLOY_DIR/"
    - cd "$DEPLOY_DIR"
    - docker compose up -d --build
    # 배포가 "성공" 으로 끝났는데 컨테이너가 죽어 있는 상태를 로그로 잡습니다.
    - docker compose ps
    # 재빌드마다 쌓이는 dangling 이미지를 치웁니다. 안 하면 배포를 반복할수록 디스크가
    # 줄어드는데, 원인이 배포와 멀어 보여서 나중에 찾기 어렵습니다.
    - docker image prune -f
