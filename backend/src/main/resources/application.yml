spring:
  application:
    name: mandarin

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mandarin}
    username: ${DB_USER:mandarin_user}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID:disabled}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:disabled}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 5m
      cookie:
        http-only: true
        same-site: lax

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXP:1800000}
  refresh-token-expiration: ${JWT_REFRESH_EXP:604800000}

auth:
  refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  catalog:
    # 기동 시 classpath:catalog/buildings.json 을 building_item 에 동기화
    seed-on-startup: ${CATALOG_SEED_ON_STARTUP:true}
  demo:
    # 시연용 API 전체(/api/v1/demo/**) 스위치 — 진행률 임의 지정 + 포인트 임의 지급.
    # 과제 수행 체크와 포인트 적립이 아직 없어 마을이 자라지도, 건물을 살 수도 없으니
    # 발표용으로 켜 둔다. 배포 환경에서도 동작해야 해서 기본값이 true 다.
    #
    # ⚠️ 정식 서비스 전에 반드시 false 로 바꾼다. 포인트를 무제한 지급할 수 있어
    # 상점 경제가 무의미해지고, 진행률도 임의로 100 으로 만들 수 있다.
    enabled: ${DEMO_ENABLED:true}

# AI 음성 코칭 입장 토큰. **AI 쪽 LiveKit 서버의 livekit.yaml 에 있는 keys: 항목,
# 그리고 ai_livekit/.env 의 LIVEKIT_API_KEY / LIVEKIT_API_SECRET 과 같은 값이어야 한다.**
# 이름을 양쪽에 똑같이 둔 이유는 어긋나도 양쪽 다 정상 기동하고 사용자만 입장에서
# 튕기기 때문이다 — 눈으로 대조할 수 있어야 한다.
livekit:
  # 브라우저가 AI 쪽 LiveKit 에 직접 붙을 주소. 이 서버는 LiveKit 에 접속하지 않는다.
  # 아래 둘과 달리 ai_livekit/.env 의 같은 이름과 값이 다르다 — 저쪽은 worker 가 같은
  # 호스트에 붙는 주소다.
  url: ${LIVEKIT_URL:}
  # iss 로 들어간다. LiveKit 은 이 값으로 검증에 쓸 시크릿을 찾는다.
  api-key: ${LIVEKIT_API_KEY:}
  # HS256 이라 32바이트 이상이어야 한다. `livekit-server --dev` 의 고정 시크릿
  # `secret` 은 6바이트라 여기에 못 쓴다 — 로컬에서도 livekit.yaml 로 키쌍을 준다.
  api-secret: ${LIVEKIT_API_SECRET:}
  room-prefix: ${LIVEKIT_ROOM_PREFIX:u_}
  token-expiration: ${LIVEKIT_TOKEN_EXP:120000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
