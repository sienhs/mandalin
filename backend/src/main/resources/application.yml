spring:
  application:
    name: mandarin

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mandarin}
    username: ${DB_USER:mandarin_user}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID:disabled}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:disabled}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 5m
      cookie:
        http-only: true
        same-site: lax

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXP:1800000}
  refresh-token-expiration: ${JWT_REFRESH_EXP:604800000}

auth:
  refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  catalog:
    # 기동 시 classpath:catalog/buildings.json 을 building_item 에 동기화
    seed-on-startup: ${CATALOG_SEED_ON_STARTUP:true}
  demo:
    # 시연용 API 전체(/api/v1/demo/**) 스위치 — 진행률 임의 지정 + 포인트 임의 지급.
    # 과제 수행 체크와 포인트 적립이 아직 없어 마을이 자라지도, 건물을 살 수도 없으니
    # 발표용으로 켜 둔다. 배포 환경에서도 동작해야 해서 기본값이 true 다.
    #
    # ⚠️ 정식 서비스 전에 반드시 false 로 바꾼다. 포인트를 무제한 지급할 수 있어
    # 상점 경제가 무의미해지고, 진행률도 임의로 100 으로 만들 수 있다.
    enabled: ${DEMO_ENABLED:true}

sfu:
  # AI 음성봇 입장 티켓 서명 키. **jwt.secret 과 반드시 다른 값이어야 한다** —
  # HS256 은 검증 키 = 서명 키라, 같은 값을 주면 SFU 서버가 액세스 토큰까지 위조할 수 있다.
  #
  # 비어 있으면 티켓 발급만 실패하고 나머지 API 는 그대로 뜬다. 기본값 없이
  # ${SFU_TICKET_SECRET} 로 두면 값이 없는 환경에서 컨텍스트 로딩이 통째로 실패해
  # 로그인까지 죽는다.
  #
  # 이 값은 **AI 서버(ai/.env)의 SFU_TICKET_SECRET 과 같아야 한다.** 어긋나면 사용자만
  # 입장에서 튕기고, 원인은 AI 서버 로그를 봐야 알 수 있다.
  ticket-secret: ${SFU_TICKET_SECRET:}
  # ai/docker-compose.yml 의 AUTH_JWT_AUDIENCE / AUTH_JWT_ISSUER 와 같아야 한다.
  audience: ${SFU_AUDIENCE:sfu}
  issuer: ${SFU_ISSUER:mandarin}
  # ai 쪽 AUTH_ROOM_PREFIX 와 같아야 한다.
  room-prefix: ${SFU_ROOM_PREFIX:u_}
  # 티켓 수명(ms). 폐기 수단이 없어서 짧은 수명이 유일한 유출 대비책이다.
  # SFU 는 시계 오차 30초까지 너그럽게 본다.
  ticket-expiration: ${SFU_TICKET_EXP:120000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
