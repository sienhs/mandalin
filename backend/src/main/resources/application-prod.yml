spring:
  # docker-compose 의 redis 서비스 이름. backend 컨테이너 기준 localhost 가 아니다
  data:
    redis:
      host: ${REDIS_HOST:redis}
  jpa:
    show-sql: false
  flyway:
    clean-disabled: true

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

auth:
  refresh-cookie-secure: true
  refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:None}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
