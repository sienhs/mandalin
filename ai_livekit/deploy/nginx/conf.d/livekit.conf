# AI EC2 의 TLS 종단. **시그널링만 지나갑니다.**
#
# 프론트가 https(Vercel)라 브라우저가 `ws://` 를 차단합니다. 그래서 `wss://` 가
# 필요하고, 인증서를 LiveKit 에 직접 물리는 대신 여기서 끊습니다 — `infra/nginx` 와
# 같은 패턴이라 certbot 갱신 방식을 하나만 알면 됩니다.
#
# **미디어(7881/7882)는 여기를 지나가지 않습니다.** WebRTC 미디어는 HTTP 가 아니라
# nginx 가 프록시할 수 없고, 브라우저가 LiveKit 에 직접 붙습니다. 그 두 포트는
# compose 가 그대로 노출하고 EC2 보안 그룹에서 열어야 합니다.

server {
    listen 80;
    server_name AI_HOST_NAME;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name AI_HOST_NAME;

    ssl_certificate     /etc/letsencrypt/live/AI_HOST_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/AI_HOST_NAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://livekit:7880;

        # WebSocket 업그레이드. **이 세 줄이 빠지면 시그널링이 붙지 않습니다** —
        # LiveKit 이 101 을 못 주고 브라우저가 연결 실패로 끝납니다.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 시그널링 소켓은 통화 내내 열려 있습니다. 기본값(60초)이면 조용한 구간마다
        # nginx 가 끊어서, 사용자에게는 "가만히 있으면 끊긴다" 로 보입니다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 버퍼링을 끕니다. 시그널링은 작은 메시지를 즉시 주고받아야 합니다.
        proxy_buffering off;
    }
}
