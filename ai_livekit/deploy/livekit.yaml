# **운영에 뜨는 것은 저장소 루트의 같은 이름 파일입니다.** CI 의 deploy_ai 잡이
# /opt/mandarin/ai_livekit 에서 `docker compose up` 을 합니다. 이 파일은 nginx 를
# AI 호스트에 두던 구성의 사본입니다(wss 는 지금 메인 EC2 가 맡습니다).
# LiveKit 서버 설정 — **`--dev` 플래그를 대체하는 파일입니다.**
#
# 로컬은 `livekit-server --dev` 로 띄우고 이 파일이 필요 없습니다. `--dev` 가 키
# 쌍(devkey/secret)·포트를 내장하기 때문입니다. 운영에서는 `--dev` 를 쓸 수 없어서
# (공개된 키로 누구나 입장 토큰을 서명할 수 있습니다) 그 값들을 여기 적습니다.
#
# **키는 이 파일에 넣지 않습니다.** compose 가 `LIVEKIT_KEYS` 환경변수로 주입합니다 —
# 이 파일은 git 에 들어가므로 시크릿을 적으면 저장소에 남습니다.

port: 7880

rtc:
  # README "포트" 의 세 개와 같은 값입니다. 로컬 `docker run -p 7880 -p 7881 -p 7882/udp`
  # 와 맞춰 두어야 "로컬에서는 되는데 배포에서 안 된다" 를 만들지 않습니다.
  tcp_port: 7881
  udp_port: 7882

  # **ICE 후보에 실을 주소입니다.** 로컬에서 `--node-ip 127.0.0.1` 이 하던 일이고,
  # 빠지면 브라우저만 실패합니다 — 시그널링은 붙는데 미디어가 안 흘러
  # `could not establish pc connection` 이 납니다(README "안 될 때").
  #
  # EC2 는 사설 IP 를 들고 있고 공개 IP 는 NAT 뒤에 있으므로, 서버가 스스로
  # 알아내게 합니다. 알아내지 못하면 `node_ip` 에 공개 IP 를 직접 적으세요.
  use_external_ip: true

# ── 방 ────────────────────────────────────────────────────────────────────
room:
  # **사용자 1명 + 에이전트 1개.** 세 번째 참가자를 서버가 거절합니다.
  #
  # 이 값이 없어도 지금은 사람이 하나입니다 — 백엔드가 방 이름을 `u_<userId>` 로,
  # identity 를 userId 로 정하기 때문입니다(`agent/entrypoint.py` 모듈 주석). 그 규칙이
  # **유일한 방어선**이라 서버에도 한 겹 둡니다. 에이전트가 `hidden=False` 로 들어와
  # 참가자로 세어지므로 **2 여야 합니다** — 1 로 두면 사용자가 있는 방에 에이전트가
  # 못 들어오고, 증상은 "브라우저는 붙는데 AI 만 안 들어옴" 입니다(README "안 될 때").
  #
  # 재접속은 막지 않습니다. 같은 identity 로 다시 붙으면 LiveKit 이 이전 참가자를
  # 끊으므로 수가 늘지 않습니다.
  max_participants: 2

  # 방 수명 = job 수명입니다. 조정 기준은 저장소 루트의 같은 이름 파일에 있습니다 —
  # 운영에 뜨는 것은 그쪽이고 이 파일은 사본입니다(맨 위 주석).
  empty_timeout: 300
  departure_timeout: 20

logging:
  level: info
  # JSON 으로 남깁니다. `docker logs` 를 수집기로 넘길 때 파싱이 됩니다.
  json: true

# ── 단일 노드입니다. Redis 를 **아직 넣지 않았습니다.** ─────────────────────
#
# Redis 의 역할은 캐시가 아니라 **클러스터 조정**입니다. 노드들이 이걸 공유합니다 —
#
#   방 -> 노드 매핑     없으면 다른 노드로 붙은 참가자가 같은 방에 못 들어갑니다
#   worker 등록 정보    없으면 job 배정이 노드 안에 갇힙니다
#   노드 부하 상태      없으면 노드 간 분산이 안 됩니다
#
# **노드 1대 + Redis 는 오히려 나쁩니다.** 얻는 것이 없는데 장애점이 하나 늘어납니다
# (Redis 가 죽으면 노드들이 서로를 못 봅니다).
#
# 넣어야 하는 조건 — 둘 중 하나라도 참이면:
#
#   ① **무중단 배포가 요구사항이 될 때.** 지금은 이 컨테이너를 재시작하면 진행 중인
#      통화가 전부 끊깁니다. 노드 2대 + Redis 면 한 대씩 빼면서 배포할 수 있습니다.
#      현실적으로 이게 가장 먼저 오는 도입 계기입니다.
#
#   ② **LiveKit 의 CPU 가 지속적으로 40% 를 넘을 때.** 실측(2026-08-03, 단일 노드
#      로컬 컨테이너)은 **RSS 32MB / CPU 0.08%** 였습니다. 이 프로젝트의 SFU 부하가
#      가벼운 이유가 셋입니다 — 오디오만 입력(비디오 없음), 에이전트가 오디오를
#      발행하지 않음(TTS 미도입), **방마다 발행자 1명**. 참가자는 사용자 + 에이전트로
#      둘이지만 트랙을 올리는 쪽은 사용자 하나이고, 방 이름이 `u_<userId>` 라
#      사용자끼리 섞이지도 않습니다(`agent/entrypoint.py` 모듈 주석). 즉 SFU 는
#      병목이 아닙니다. 먼저 막히는 것은 LLM 게이트웨이 rate limit 이고 그건
#      Redis 로 해결되지 않습니다.
#
# 넣을 때 같이 해야 하는 일:
#
#   redis:
#     address: redis:6379
#
# 그리고 **로드밸런서**가 필요합니다. 브라우저는 `LIVEKIT_URL` 하나로 붙는데 노드가
# 둘이면 앞에 분산 계층이 있어야 합니다. 시그널링은 `deploy/nginx` 의 `upstream` 에
# 노드를 늘리면 되지만, **미디어(7881/7882)는 nginx 를 우회**하므로 노드별로 포트가
# 따로 노출돼야 합니다 — 단순 작업이 아닙니다.
#
# `infra/docker-compose.yml` 의 `redis` 와는 **무관합니다.** 저쪽은 다른 호스트에서
# Spring 이 리포트 캐시로 쓰는 것입니다.
