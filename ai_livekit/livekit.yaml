# 운영용 LiveKit 서버 설정. 로컬의 `--dev` 를 대체합니다.
#
# **`--dev` 를 운영에서 쓰면 안 됩니다.** 그 모드는 키를 `devkey`/`secret` 으로 고정하고
# 로그 레벨을 debug 로 올립니다 — 공개 IP 에 그대로 띄우면 누구나 토큰을 서명해서
# 방에 들어옵니다.
#
# **키는 여기 없습니다.** `LIVEKIT_KEYS` 환경변수로 들어갑니다(compose 참고). 이 파일은
# 저장소에 커밋되므로 시크릿을 적으면 안 됩니다.

port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882

  # **브라우저가 미디어를 보낼 주소입니다. 틀리면 연결만 조용히 실패합니다.**
  #
  # 로컬에서 `--node-ip 127.0.0.1` 이 하던 일입니다. 이 값이 없으면 LiveKit 이 사설 IP
  # (172.31.x.x)를 ICE 후보로 광고하고, 브라우저는 거기에 닿지 못해
  # `could not establish pc connection` 으로 끝납니다.
  #
  # 자동 탐지(`use_external_ip: true`)를 쓰지 않는 이유는 그쪽이 EC2 메타데이터
  # (169.254.169.254)를 읽는데, IMDSv2 의 기본 hop limit 이 1 이라 컨테이너에서 막힐 수
  # 있어서입니다. 어차피 **Elastic IP 라 안 바뀌므로** 고정값이 더 안전합니다.
  # (eipalloc-00e4255609b017161 → i-086f7b6c94207951e)
  node_ip: 52.78.195.46

# 사용자 1명 + 에이전트 1개. 에이전트도 참가자로 세어지므로 2 입니다 — 1 로 두면
# 에이전트가 방에 못 들어옵니다. tests/test_single_user_room.py 가 이 값을 지킵니다.
room:
  max_participants: 2

logging:
  # `--dev` 의 debug 는 발화마다 수십 줄을 남깁니다. 운영에서 볼 것도 아닌데 디스크만 씁니다.
  level: info
