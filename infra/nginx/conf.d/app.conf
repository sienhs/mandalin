server {
    listen 80;
    server_name i15d106.p.ssafy.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name i15d106.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/i15d106.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i15d106.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # AI 음성봇 시그널링(WebSocket) — **이 블록만 다른 호스트로 나간다.**
    # SFU 는 메인 서버가 아니라 전용 EC2 에 있다. 프론트가 https(Vercel)라 브라우저가
    # ws:// 를 막으므로, 여기서 wss 를 받아 평문 ws 로 넘겨 준다. 시그널링만 여기를
    # 지나가고 미디어(RTP)는 브라우저와 SFU 가 직접 주고받으므로 경유 부하는 거의 없다.
    #
    # **사설 IP 가 아니라 공인 IP 다.** AI 서버는 개인 AWS 계정에 있어 이 서버와 VPC 가
    # 다르다 — 172.31.x 로 적으면 붙지 않는다. 상대는 탄력적 IP 라 재부팅으로 바뀌지
    # 않지만, 인스턴스를 새로 만들면 여기도 같이 고쳐야 한다.
    #
    # location 은 최장 prefix 가 이기므로 아래 `location /` 보다 이 블록이 먼저 잡힌다.
    # proxy_pass 에 경로를 붙이지 않았으니 `/ws/{room_id}` 가 그대로 전달된다.
    location /ws/ {
        proxy_pass http://52.78.195.46:8081;
        proxy_http_version 1.1;

        # 이 두 줄이 빠지면 101 Switching Protocols 로 승격되지 않고 평범한 HTTP 요청이
        # 되어, 클라이언트는 이유를 알기 어려운 연결 실패만 보게 된다.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 시그널링은 join 을 마치면 한동안 조용하다. 기본값 60초로 두면 통화 중에
        # 소켓이 끊기는데, 클라이언트에 재연결이 없어(ai/README "알려진 한계")
        # 사용자는 새로고침해야 한다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Kakao OAuth redirect-uri는 {baseUrl}/login/oauth2/code/kakao 형태로,
    # 요청 시점의 scheme/host를 그대로 사용한다 (Spring server.forward-headers-strategy: framework).
    # 아래 헤더가 빠지면 baseUrl이 http://backend:8080 같은 내부 주소로 계산되어
    # 카카오 개발자 콘솔에 등록한 Redirect URI와 불일치가 발생한다.
    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}
