# WebSocket 업그레이드용. `Connection` 은 홉 단위 헤더라 그대로 넘기면 안 되고, 업그레이드
# 요청일 때만 `upgrade` 로 바꿔야 한다. 평범한 HTTP 요청까지 `upgrade` 를 달면 백엔드가
# 혼란스러워한다.
#
# conf.d/*.conf 는 http 블록 안에 include 되므로 map 을 여기 둘 수 있다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name i15d106.p.ssafy.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name i15d106.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/i15d106.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i15d106.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ── AI 음성 코칭(LiveKit) 시그널링 ────────────────────────────────────
    #
    # **시그널링만 지나간다. 미디어는 안 지나간다.** 브라우저는 여기서 방에 들어간 뒤
    # 오디오는 AI EC2(52.78.195.46)의 UDP 7882 로 직접 보낸다. nginx 를 거치는 것은
    # WebSocket 한 줄뿐이라 이 서버에 부하가 생기지 않는다.
    #
    # **왜 우회하나:** 프론트가 Vercel 에서 https 로 뜨는데 AI EC2 에는 인증서가 없다.
    # `ws://52.78.195.46:7880` 을 그대로 부르면 네트워크에 나가지도 못하고 브라우저가
    # mixed content 로 막는다. 여기 이미 있는 인증서를 빌려 쓰면 도메인을 더 사지 않아도
    # 된다. 백엔드가 응답에 실어 주는 LIVEKIT_URL 을 `wss://i15d106.p.ssafy.io/livekit`
    # 로 맞춰야 한다(infra/.env).
    #
    # **경로 우선순위:** 접두 매칭이라 아래 `location /` 보다 이쪽이 먼저 잡힌다.
    # proxy_pass 끝의 `/` 가 `/livekit` 접두를 떼므로 `/livekit/rtc` → `/rtc` 로 간다.
    # 이 슬래시를 빼면 LiveKit 이 `/livekit/rtc` 를 받고 404 를 준다.
    #
    # **주의:** 이 구간(메인 EC2 → AI EC2)은 평문 ws 다. 같은 리전이지만 공개 IP 를
    # 거치므로, 입장 토큰이 암호화되지 않은 채 지나간다. 토큰 수명이 2분이라 감수하는
    # 것이고, 더 조이려면 AI EC2 쪽에도 인증서를 붙여 wss 로 넘겨야 한다.
    location /livekit/ {
        proxy_pass http://52.78.195.46:7880/;
        proxy_http_version 1.1;

        # 이 두 줄이 빠지면 업그레이드가 성립하지 않아 LiveKit 이 400 을 준다.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # **기본값 60초를 반드시 올린다.** 시그널링 소켓은 대화 중에도 한동안 조용한데,
        # 그대로 두면 nginx 가 끊어 버린다. 증상이 "통화 중 갑자기 끊김" 으로만 보여서
        # 원인이 nginx 라는 걸 알아채기 어렵다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Kakao OAuth redirect-uri는 {baseUrl}/login/oauth2/code/kakao 형태로,
    # 요청 시점의 scheme/host를 그대로 사용한다 (Spring server.forward-headers-strategy: framework).
    # 아래 헤더가 빠지면 baseUrl이 http://backend:8080 같은 내부 주소로 계산되어
    # 카카오 개발자 콘솔에 등록한 Redirect URI와 불일치가 발생한다.
    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}
