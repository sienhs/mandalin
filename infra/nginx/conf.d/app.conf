server {
    listen 80;
    server_name i15d106.p.ssafy.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name i15d106.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/i15d106.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i15d106.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # LiveKit 은 여기를 지나가지 않는다. AI EC2 는 이 서버와 통신하지 않고, 백엔드는
    # 토큰을 서명만 할 뿐 LiveKit 에 접속하지 않는다(검증은 LiveKit 이 공유 시크릿으로
    # 자기가 한다). 브라우저가 LIVEKIT_URL 로 AI EC2 에 직접 붙는다.

    # Kakao OAuth redirect-uri는 {baseUrl}/login/oauth2/code/kakao 형태로,
    # 요청 시점의 scheme/host를 그대로 사용한다 (Spring server.forward-headers-strategy: framework).
    # 아래 헤더가 빠지면 baseUrl이 http://backend:8080 같은 내부 주소로 계산되어
    # 카카오 개발자 콘솔에 등록한 Redirect URI와 불일치가 발생한다.
    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}
