version: "3.8"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - app-net

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "true"

  backend:
    build: ../backend
    container_name: backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # AI 음성봇 입장 티켓 서명 키. **AI 전용 EC2 의 ai/.env 에 있는 SFU_TICKET_SECRET 과
      # 같은 값이어야 한다.** 두 호스트에 나뉘어 있어서 어긋나도 양쪽 다 기동은 되고,
      # 사용자만 입장에서 튕긴다 — 한쪽을 바꾸면 반드시 같이 바꿀 것.
      #
      # JWT_SECRET 을 재사용하면 안 된다(SFU 가 액세스 토큰까지 위조할 수 있게 된다).
      # 비워두면 티켓 발급만 실패하고 나머지 API 는 정상 동작한다.
      SFU_TICKET_SECRET: ${SFU_TICKET_SECRET:-}
      KAKAO_OAUTH_CLIENT_ID: ${KAKAO_OAUTH_CLIENT_ID}
      KAKAO_OAUTH_CLIENT_SECRET: ${KAKAO_OAUTH_CLIENT_SECRET}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      REFRESH_COOKIE_SECURE: "true"
    depends_on:
      - postgres
    networks:
      - app-net
    # 외부에 직접 노출하지 않음 — nginx를 통해서만 접근

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app-net

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-net

volumes:
  postgres_data:
  redis_data:
  jenkins_home:
  certbot_www:
  certbot_certs:

networks:
  app-net:
