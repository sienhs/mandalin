version: "3.8"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - app-net

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "true"

  backend:
    build: ../backend
    container_name: backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_URL: ${GEMINI_URL:-https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      KAKAO_OAUTH_CLIENT_ID: ${KAKAO_OAUTH_CLIENT_ID}
      KAKAO_OAUTH_CLIENT_SECRET: ${KAKAO_OAUTH_CLIENT_SECRET}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      REFRESH_COOKIE_SECURE: "true"
      # 테스트 계정 로그인(tester1~3). **이 두 줄이 없으면 배포에서만 동작하지 않는다** —
      # 여기 적힌 것만 컨테이너에 들어가므로, .env 에 값을 넣어도 앱은 못 본다. 그러면
      # 비밀번호가 빈 값이 되어 로그인이 401 이고 계정 목록도 빈 배열이라, 프론트에 입구가
      # 그려지지 않는다(로컬에서는 되는데 배포에서만 안 되는 모양으로 드러난다).
      TEST_LOGIN_ENABLED: ${TEST_LOGIN_ENABLED:-true}
      TEST_LOGIN_PASSWORD: ${TEST_LOGIN_PASSWORD:-}
    depends_on:
      - postgres
      - redis
    networks:
      - app-net

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app-net

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-net

volumes:
  postgres_data:
  redis_data:
  jenkins_home:
  certbot_www:
  certbot_certs:

networks:
  app-net:
