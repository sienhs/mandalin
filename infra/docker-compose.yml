version: "3.8"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - app-net

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "true"

  backend:
    build: ../backend
    container_name: backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # AI 음성 코칭(LiveKit) 입장 토큰. **AI 전용 EC2 의 livekit.yaml 에 있는 keys:
      # 항목, 그리고 ai_livekit/.env 의 같은 이름 두 개와 같은 값이어야 한다.**
      # 두 호스트에 나뉘어 있어서 어긋나도 양쪽 다 기동은 되고, 사용자만 입장에서
      # 튕긴다 — 한쪽을 바꾸면 반드시 같이 바꿀 것.
      #
      # JWT_SECRET 을 재사용하면 안 된다(LiveKit 서버가 액세스 토큰까지 위조할 수
      # 있게 된다). 비워두면 토큰 발급만 실패하고 나머지 API 는 정상 동작한다.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # 브라우저가 AI EC2 로 직접 붙을 주소. 응답에 실려 나가므로 컨테이너 내부 이름이
      # 아니라 공개 주소여야 한다. **위 둘과 달리 ai_livekit/.env 의 같은 이름과 값이
      # 다르다** — 저쪽은 worker 가 같은 호스트에 붙는 주소다.
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      # 리포트 생성용 Gemini. 로컬은 backend/.env 를 spring.config.import 로 읽지만
      # 그 파일은 gitignore 라 EC2 에 없다 — 여기로 넘겨주지 않으면 컨테이너 안에는
      # 값이 아예 없고, 리포트 API 만 AI_REQUEST_FAILED 로 죽는다.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # SSAFY GMS 게이트웨이. 비워두면 구글 공식 엔드포인트로 가는데 GMS 키로는
      # 인증이 안 되므로, 빈 값이 들어가지 않도록 기본값을 여기서 박아 둔다.
      GEMINI_URL: ${GEMINI_URL:-https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      KAKAO_OAUTH_CLIENT_ID: ${KAKAO_OAUTH_CLIENT_ID}
      KAKAO_OAUTH_CLIENT_SECRET: ${KAKAO_OAUTH_CLIENT_SECRET}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      REFRESH_COOKIE_SECURE: "true"
    depends_on:
      - postgres
      - redis
    networks:
      - app-net
    # 외부에 직접 노출하지 않음 — nginx를 통해서만 접근

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app-net

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-net

volumes:
  postgres_data:
  redis_data:
  jenkins_home:
  certbot_www:
  certbot_certs:

networks:
  app-net:
